services:
  - type: web
    name: insightcanvas-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: USE_LANGCHAIN
        value: false
      - key: ENABLE_RAG_EMBEDDINGS
        value: false
      - key: MAX_UPLOAD_BYTES
        value: 10485760
      - key: MAX_ANALYSIS_ROWS
        value: 25000
      - key: MAX_CHART_ROWS
        value: 5000
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
